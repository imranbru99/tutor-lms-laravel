services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tutorforge-app:latest
    container_name: tutorforge_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: tutorforge
      DB_USERNAME: tutorforge
      DB_PASSWORD: secretpassword
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SCOUT_DRIVER: meilisearch
      MEILISEARCH_HOST: http://meilisearch:7700
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    volumes:
      - .:/var/www/html
      - ./storage/app:/var/www/html/storage/app
    networks:
      - tutorforge-network
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:alpine
    container_name: tutorforge_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - tutorforge-network
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: tutorforge_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tutorforge
      MYSQL_USER: tutorforge
      MYSQL_PASSWORD: secretpassword
      MYSQL_ROOT_PASSWORD: rootsecretpassword
    ports:
      - "3306:3306"
    volumes:
      - tutorforge_mysql_data:/var/lib/mysql
    networks:
      - tutorforge-network

  redis:
    image: redis:alpine
    container_name: tutorforge_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - tutorforge_redis_data:/data
    networks:
      - tutorforge-network

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: tutorforge_meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: tutorforge_meili_secret_key
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - tutorforge_meili_data:/meili_data
    networks:
      - tutorforge-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: tutorforge_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - tutorforge-network

  minio:
    image: minio/minio:latest
    container_name: tutorforge_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - tutorforge_minio_data:/data
    networks:
      - tutorforge-network

networks:
  tutorforge-network:
    driver: bridge

volumes:
  tutorforge_mysql_data:
  tutorforge_redis_data:
  tutorforge_meili_data:
  tutorforge_minio_data:
