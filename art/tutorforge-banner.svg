<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="tfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Vibrant Ambient Orbs -->
    <radialGradient id="orbIndigo" cx="15%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbEmerald" cx="85%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbCyan" cx="50%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Card Glass Surfaces -->
    <linearGradient id="glassSurface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="textGradPrimary" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#a5b4fc" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="40%" stop-color="#8b5cf6" />
      <stop offset="80%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif; }
    .title { font-weight: 800; font-size: 58px; letter-spacing: -1.5px; fill: url(#textGradPrimary); }
    .subtitle { font-weight: 400; font-size: 21px; fill: #94a3b8; }
    .tag-text { font-weight: 600; font-size: 13px; fill: #c7d2fe; letter-spacing: 0.5px; }
  </style>

  <!-- Background Layer -->
  <rect width="1280" height="640" fill="url(#tfBg)" />
  <rect width="1280" height="640" fill="url(#orbIndigo)" />
  <rect width="1280" height="640" fill="url(#orbEmerald)" />
  <rect width="1280" height="640" fill="url(#orbCyan)" />

  <!-- Technical Grid Grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="80" x2="1280" y2="80" />
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="240" x2="1280" y2="240" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="400" x2="1280" y2="400" />
    <line x1="0" y1="480" x2="1280" y2="480" />
    <line x1="0" y1="560" x2="1280" y2="560" />
    <line x1="160" y1="0" x2="160" y2="640" />
    <line x1="320" y1="0" x2="320" y2="640" />
    <line x1="480" y1="0" x2="480" y2="640" />
    <line x1="640" y1="0" x2="640" y2="640" />
    <line x1="800" y1="0" x2="800" y2="640" />
    <line x1="960" y1="0" x2="960" y2="640" />
    <line x1="1120" y1="0" x2="1120" y2="640" />
  </g>

  <!-- Brand Pill Badge -->
  <g transform="translate(450, 80)">
    <rect width="380" height="38" rx="19" fill="#1e1b4b" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="22" cy="19" r="6" fill="#10b981" />
    <text x="38" y="24" class="font-sans tag-text">TUTOR LMS v4 RE-ARCHITECTED IN LARAVEL</text>
  </g>

  <!-- Main Hero Brand Title -->
  <g transform="translate(640, 185)" text-anchor="middle">
    <text class="font-sans title">Tutor<tspan fill="url(#brandGrad)">Forge</tspan></text>
    <text y="54" class="font-sans subtitle">Enterprise AI-Powered LMS · Triple Multi-Panel · Global &amp; BD Payments</text>
  </g>

  <!-- Showcase Mockup Cards (3-Column Isometric Preview) -->
  <g transform="translate(100, 310)">
    <!-- Card 1: Course Builder & Content Bank -->
    <g transform="translate(0, 0)">
      <rect width="320" height="230" rx="16" fill="url(#glassSurface)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
      <rect x="20" y="20" width="36" height="36" rx="8" fill="#6366f1" fill-opacity="0.2" />
      <path d="M30 38 L38 30 L46 38 M38 30 L38 46" stroke="#818cf8" stroke-width="2" stroke-linecap="round" fill="none" />
      <text x="68" y="36" class="font-sans" font-size="16" font-weight="700" fill="#ffffff">Course Builder</text>
      <text x="68" y="52" class="font-sans" font-size="12" fill="#94a3b8">Drag-and-drop 3-pane visual studio</text>
      <!-- Item Tree Mock -->
      <rect x="20" y="75" width="280" height="32" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
      <text x="34" y="96" class="font-sans" font-size="12" fill="#cbd5e1">📂 Module 1: Modern Laravel 12 Architecture</text>
      <rect x="36" y="115" width="264" height="28" rx="6" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="0.8" />
      <text x="50" y="133" class="font-sans" font-size="11" fill="#38bdf8">▶ Video Lesson: Action Pattern &amp; DTOs</text>
      <rect x="36" y="150" width="264" height="28" rx="6" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="0.8" />
      <text x="50" y="168" class="font-sans" font-size="11" fill="#a855f7">⚡ Quiz: Strategy-Pattern Grading (13+ Types)</text>
      <!-- AI badge -->
      <rect x="20" y="190" width="130" height="22" rx="11" fill="#4f46e5" fill-opacity="0.2" stroke="#6366f1" stroke-width="1" />
      <text x="32" y="205" class="font-sans" font-size="10" font-weight="600" fill="#a5b4fc">✨ AI Copilot Active</text>
    </g>

    <!-- Card 2: Continuous Learning Player (Center Spotlight) -->
    <g transform="translate(360, -20)">
      <rect width="360" height="260" rx="18" fill="url(#glassSurface)" stroke="#6366f1" stroke-opacity="0.4" stroke-width="1.5" />
      <!-- Top header bar -->
      <rect x="0" y="0" width="360" height="42" rx="18" fill="#1e293b" fill-opacity="0.8" />
      <circle cx="24" cy="21" r="5" fill="#ef4444" />
      <circle cx="38" cy="21" r="5" fill="#eab308" />
      <circle cx="52" cy="21" r="5" fill="#22c55e" />
      <text x="75" y="26" class="font-sans" font-size="12" font-weight="600" fill="#f8fafc">Learning Player: Continuous Mode</text>
      <!-- Video player simulation -->
      <rect x="20" y="58" width="320" height="130" rx="10" fill="#020617" stroke="#334155" stroke-width="1" />
      <circle cx="180" cy="120" r="22" fill="#6366f1" fill-opacity="0.9" />
      <polygon points="176,112 188,120 176,128" fill="#ffffff" />
      <rect x="30" y="172" width="220" height="6" rx="3" fill="#334155" />
      <rect x="30" y="172" width="160" height="6" rx="3" fill="#6366f1" />
      <text x="260" y="178" class="font-sans" font-size="10" fill="#94a3b8">18:42 / 24:10</text>
      <!-- Player action bar -->
      <rect x="20" y="202" width="150" height="36" rx="8" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
      <text x="35" y="225" class="font-sans" font-size="12" font-weight="600" fill="#34d399">✓ Mark Complete</text>
      <rect x="185" y="202" width="155" height="36" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <text x="205" y="225" class="font-sans" font-size="12" font-weight="600" fill="#cbd5e1">Next Lesson →</text>
    </g>

    <!-- Card 3: Monetization & Bangladesh + Global Gateways -->
    <g transform="translate(760, 0)">
      <rect width="320" height="230" rx="16" fill="url(#glassSurface)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />
      <rect x="20" y="20" width="36" height="36" rx="8" fill="#10b981" fill-opacity="0.2" />
      <text x="32" y="44" class="font-sans" font-size="20" font-weight="800" fill="#34d399">৳</text>
      <text x="68" y="36" class="font-sans" font-size="16" font-weight="700" fill="#ffffff">Unified Checkout</text>
      <text x="68" y="52" class="font-sans" font-size="12" fill="#94a3b8">Multi-currency (৳ BDT &amp; $ USD)</text>
      <!-- Gateways badges grid -->
      <g transform="translate(20, 75)">
        <rect width="85" height="32" rx="6" fill="#e11d48" fill-opacity="0.15" stroke="#e11d48" stroke-width="1" />
        <text x="42" y="21" class="font-sans" font-size="12" font-weight="700" fill="#fb7185" text-anchor="middle">bKash</text>

        <rect x="95" width="85" height="32" rx="6" fill="#ea580c" fill-opacity="0.15" stroke="#ea580c" stroke-width="1" />
        <text x="137" y="21" class="font-sans" font-size="12" font-weight="700" fill="#fb923c" text-anchor="middle">Nagad</text>

        <rect x="190" width="85" height="32" rx="6" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-width="1" />
        <text x="232" y="21" class="font-sans" font-size="12" font-weight="700" fill="#818cf8" text-anchor="middle">Stripe</text>

        <rect y="42" width="85" height="32" rx="6" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="1" />
        <text x="42" y="63" class="font-sans" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">SSLCommerz</text>

        <rect x="95" y="42" width="85" height="32" rx="6" fill="#2563eb" fill-opacity="0.15" stroke="#2563eb" stroke-width="1" />
        <text x="137" y="63" class="font-sans" font-size="12" font-weight="700" fill="#60a5fa" text-anchor="middle">PayPal</text>

        <rect x="190" y="42" width="85" height="32" rx="6" fill="#059669" fill-opacity="0.15" stroke="#059669" stroke-width="1" />
        <text x="232" y="63" class="font-sans" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">Bank / Offline</text>
      </g>
      <!-- Security / Idempotency tag -->
      <rect x="20" y="165" width="275" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="32" y="184" class="font-sans" font-size="11" font-weight="600" fill="#f8fafc">🔒 Signed Webhooks &amp; Idempotency</text>
      <text x="32" y="198" class="font-sans" font-size="10" fill="#94a3b8">Zero float precision · Double-entry payouts</text>
    </g>
  </g>
</svg>
